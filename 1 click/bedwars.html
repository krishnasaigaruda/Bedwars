<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlockWars</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
/* Chunky, warm wood theme in the spirit of minefun. */
:root {
  --ink: #2a1a10;
  --wood: #a8652f;
  --wood-hi: #c98a4c;
  --wood-dark: #6b3c1a;
  --wood-edge: #43240e;
  --cream: #fff1d6;
  --muted: #f3d9ae;
  --gold: #ffd23f;
  --green: #5bd23c;
  --green-dark: #2e8a1d;
  --red: #ff4f45;
  --red-dark: #a3241d;
  --sky: #bfe7ff;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--sky);
  color: #fff;
  font-family: Rubik, system-ui, sans-serif;
  user-select: none;
  -webkit-user-select: none;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hidden { display: none !important; }
img { image-rendering: pixelated; }

/* ------------------------------------------------------------ shared pieces */

.panel {
  background: linear-gradient(180deg, var(--wood-hi) 0%, var(--wood) 14%, #98572a 100%);
  border: 4px solid var(--wood-edge);
  border-radius: 16px;
  box-shadow: inset 0 3px 0 rgba(255, 220, 170, 0.45), inset 0 -4px 0 rgba(0, 0, 0, 0.2), 0 8px 0 rgba(0, 0, 0, 0.35);
  padding: 16px;
  color: var(--cream);
}
.panel-title {
  font-family: 'Lilita One', Rubik, sans-serif;
  font-size: 30px;
  text-align: center;
  color: #fff;
  -webkit-text-stroke: 6px var(--ink);
  paint-order: stroke fill;
  letter-spacing: 0.5px;
  margin: -4px 0 6px;
}
.btn {
  font: 400 19px 'Lilita One', Rubik, sans-serif;
  letter-spacing: 0.5px;
  color: #fff;
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
  border: 3px solid var(--ink);
  border-radius: 12px;
  padding: 10px 14px;
  cursor: pointer;
  background: var(--wood-hi);
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.35), 0 5px 0 var(--ink);
  transition: transform 0.06s, box-shadow 0.06s, filter 0.1s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(4px); box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.35), 0 1px 0 var(--ink); }
.btn-green { background: linear-gradient(#7be84f, var(--green)); }
.btn-yellow { background: linear-gradient(#ffe066, #ffbe1a); }
.btn-wood { background: linear-gradient(#d99a5a, #b06c33); }
.btn-red { background: linear-gradient(#ff7a6b, var(--red)); }
.btn-big { font-size: 34px; padding: 12px; }
.input {
  width: 100%;
  font: 700 17px Rubik, sans-serif;
  color: var(--ink);
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 10px;
  padding: 9px 12px;
  outline: none;
  box-shadow: inset 0 3px 0 rgba(0, 0, 0, 0.12);
}
.input:focus { border-color: #fff; box-shadow: 0 0 0 3px var(--ink); }
.field-label {
  font: 400 15px 'Lilita One', Rubik, sans-serif;
  letter-spacing: 1px;
  color: #fff;
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
}

/* ------------------------------------------------------------ menu */

#menu {
  position: fixed;
  inset: 0;
  display: flex;
  padding: 16px;
  overflow-y: auto;
  background: radial-gradient(ellipse at center, rgba(20, 10, 0, 0) 30%, rgba(20, 10, 0, 0.45));
}
.menu-wrap { width: min(460px, 100%); margin: auto; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.logo {
  font-family: 'Lilita One', Rubik, sans-serif;
  font-size: clamp(42px, 11vw, 74px);
  line-height: 1;
  white-space: nowrap;
}
.logo span {
  display: inline-block;
  color: var(--c);
  -webkit-text-stroke: 9px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 6px 0 var(--ink), 0 9px 0 rgba(0, 0, 0, 0.25);
  animation: drop-in 0.6s cubic-bezier(.3, 1.6, .5, 1) both, float 2.6s ease-in-out infinite;
  animation-delay: calc(var(--i) * 0.06s), calc(0.7s + var(--i) * 0.12s);
}
@keyframes drop-in { from { transform: translateY(-80px) scale(0.6); opacity: 0; } }
@keyframes float { 50% { transform: translateY(-6px) rotate(-3deg); } }
.tagline {
  font: 400 19px 'Lilita One', Rubik, sans-serif;
  color: #fff;
  -webkit-text-stroke: 5px var(--ink);
  paint-order: stroke fill;
  margin-bottom: 4px;
}
.menu-card { width: 100%; display: flex; flex-direction: column; gap: 9px; }
.modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.mode {
  font: inherit;
  text-align: left;
  color: var(--ink);
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 12px;
  padding: 7px 11px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 2px;
  box-shadow: 0 4px 0 var(--ink);
  transition: transform 0.08s;
}
.mode:hover { transform: translateY(-2px); }
.mode.active { background: #ffe680; box-shadow: 0 4px 0 var(--ink), inset 0 0 0 3px #fff; }
.mode-name { font-family: 'Lilita One', Rubik, sans-serif; font-size: 21px; }
.mode-desc { font-size: 13px; font-weight: 700; color: #7a5232; }
.mode-dots { display: flex; gap: 3px; margin-top: 2px; }
.mode-dots i { width: 11px; height: 11px; border-radius: 3px; border: 2px solid var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 400 15px 'Lilita One', Rubik, sans-serif;
  color: var(--ink);
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 999px;
  padding: 5px 12px;
  cursor: pointer;
  box-shadow: 0 3px 0 var(--ink);
}
.chip.active { background: #ffe680; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.join { display: flex; gap: 6px; }
.join .input.code { text-transform: uppercase; letter-spacing: 3px; text-align: center; padding: 9px 4px; min-width: 0; }
.menu-note { min-height: 18px; font-size: 14px; color: #fff; text-align: center; font-weight: 800; text-shadow: 0 2px 0 var(--ink); }
.menu-foot { display: flex; gap: 8px; color: #fff; }
.link {
  font: 400 16px 'Lilita One', Rubik, sans-serif; color: #fff; background: none; border: none; cursor: pointer;
  -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill;
}

.modal { position: fixed; inset: 0; background: rgba(20, 10, 0, 0.5); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal-card { width: min(440px, 100%); display: flex; flex-direction: column; gap: 12px; }
.slider { display: flex; flex-direction: column; gap: 6px; font-weight: 800; color: #fff; text-shadow: 0 2px 0 var(--ink); }
.slider b { color: var(--gold); float: right; }
.slider input { width: 100%; accent-color: var(--gold); }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 800; text-shadow: 0 2px 0 var(--ink); cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--green); }
.controls { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; font-size: 14px; font-weight: 700; text-shadow: 0 1px 0 var(--ink); }
kbd {
  font: 400 13px 'Lilita One', Rubik, sans-serif;
  color: var(--ink);
  background: var(--cream);
  border: 2px solid var(--ink);
  border-radius: 7px;
  padding: 3px 8px;
  box-shadow: 0 3px 0 var(--ink);
  white-space: nowrap;
}

@media (max-width: 420px) { .row { grid-template-columns: 1fr; } }

/* ------------------------------------------------------------ hud */

#hud { position: fixed; inset: 0; pointer-events: none; }
#hud.hud-off > :not(.death):not(.pause) { visibility: hidden; }
.crosshair {
  position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; transform: translate(-50%, -50%);
  border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.75);
}
.prompt {
  position: absolute; left: 50%; top: calc(50% + 34px); transform: translateX(-50%);
  font: 400 18px 'Lilita One', Rubik, sans-serif; color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill;
  display: flex; align-items: center; gap: 8px; white-space: nowrap;
}
.prompt b {
  display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px;
  background: var(--cream); color: var(--ink); -webkit-text-stroke: 0; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
}

.bottom { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.stats { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; padding: 0 6px; }
.hearts { display: flex; gap: 2px; flex-wrap: wrap; max-width: 300px; }
.heart { width: 26px; height: 26px; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.45)); }
.heart path { stroke: var(--ink); stroke-width: 0.7px; paint-order: stroke; }
.heart.full path { fill: #ff3b3b; }
.heart.half path { fill: url(#heart-half); }
.heart.empty path { fill: #4a2020; }
.heart.gold path { fill: #ffcc2e; }
.heart.gold.half path { fill: url(#heart-gold-half); }
.hearts.low .heart.full { animation: jiggle 0.5s infinite; }
.hearts.shake { animation: shake 0.3s; }
@keyframes jiggle { 50% { transform: translateY(-2px); } }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.hunger {
  position: relative; width: 210px; height: 22px; border: 3px solid var(--ink); border-radius: 6px;
  background: #3d2a1c; overflow: hidden; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
}
.hunger-fill { height: 100%; width: 100%; background: linear-gradient(#a3f15c, #66c92c); transition: width 0.3s; }
.hunger-fill.low { background: linear-gradient(#ffb35c, #e8762c); }
.hunger-label {
  position: absolute; left: 7px; top: 50%; transform: translateY(-50%);
  font: 400 14px 'Lilita One', Rubik, sans-serif; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
}

.hotbar {
  display: flex; gap: 5px; padding: 18px 8px 8px; position: relative;
  background: linear-gradient(#b8763e, #8f5426); border: 4px solid var(--wood-edge); border-radius: 12px;
  box-shadow: inset 0 3px 0 rgba(255, 220, 170, 0.4), 0 6px 0 rgba(0, 0, 0, 0.35);
  pointer-events: auto;
}
.slot {
  position: relative; width: 56px; height: 56px; border-radius: 8px;
  background: #d39457; border: 3px solid #5a3214;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18), inset 0 3px 0 rgba(255, 255, 255, 0.2);
  display: grid; place-items: center;
}
.slot.selected { border-color: var(--gold); box-shadow: 0 0 0 3px var(--ink), inset 0 0 0 2px #fff6c0; background: #e8ad6a; }
.slot.pulse .slot-icon { animation: pop 0.25s; }
@keyframes pop { 50% { transform: scale(1.25); } }
.slot-icon { width: 40px; height: 40px; display: block; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.35)); }
.slot-key {
  position: absolute; top: -17px; left: 50%; transform: translateX(-50%);
  font: 400 13px 'Lilita One', Rubik, sans-serif; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
  background: #8f5426; border: 2px solid var(--wood-edge); border-radius: 5px; padding: 0 5px; line-height: 15px;
}
.slot-count {
  position: absolute; right: 3px; bottom: 0; font: 400 18px 'Lilita One', Rubik, sans-serif;
  color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill;
}
.slot-more { cursor: pointer; display: flex; gap: 4px; align-items: center; justify-content: center; background: #c98a4c; }
.slot-more i { width: 8px; height: 8px; border-radius: 50%; background: var(--cream); border: 2px solid var(--ink); }

.feed { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.feed-msg {
  font: 400 17px 'Lilita One', Rubik, sans-serif; color: var(--gold); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
  background: rgba(30, 20, 12, 0.6); border-radius: 7px; padding: 3px 9px; animation: slide-in 0.25s; transition: opacity 0.4s;
}
.feed-msg.out { opacity: 0; }
@keyframes slide-in { from { transform: translateX(-20px); opacity: 0; } }

.banner {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  font: 400 clamp(20px, 3vw, 32px) 'Lilita One', Rubik, sans-serif; color: #fff; white-space: nowrap;
  background: #1b1512; border: 4px solid #3a2f28; outline: 3px solid #000; border-radius: 10px; padding: 6px 18px;
  box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
}
.banner em { font-style: normal; color: var(--gold); }

.board {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%); min-width: 190px;
  background: rgba(25, 16, 10, 0.62); border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 14px; line-height: 1.55;
}
.board-title { font: 400 20px 'Lilita One', Rubik, sans-serif; color: var(--gold); text-align: center; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
.board-row { display: flex; justify-content: space-between; gap: 12px; }
.board-row b { font-weight: 800; }
.board-sep { height: 6px; }
.board .you { text-decoration: underline; }

.keyhints { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.kh { display: flex; align-items: center; gap: 6px; font: 400 14px 'Lilita One', Rubik, sans-serif; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
.kh b {
  min-width: 34px; height: 34px; padding: 0 6px; display: grid; place-items: center; border-radius: 9px;
  background: #fff; color: var(--ink); -webkit-text-stroke: 0; font-weight: 400; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
}

.effects { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
.fx {
  display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px; border-radius: 10px;
  background: rgba(25, 16, 10, 0.62); border: 2px solid rgba(255, 255, 255, 0.12); min-width: 150px;
}
.fx img { width: 30px; height: 30px; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.4)); }
.fx b { display: block; font: 400 15px 'Lilita One', Rubik, sans-serif; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
.fx span { display: block; font-size: 11px; font-weight: 800; color: var(--muted); }
.fx.on { border-color: #5bd23c; animation: fx-glow 1.2s ease-in-out infinite; }
@keyframes fx-glow { 50% { box-shadow: 0 0 12px rgba(91, 210, 60, 0.7); } }
.offer-cost small { display: block; width: 100%; font-size: 11px; color: #7a5232; font-weight: 700; margin-top: 2px; }
.shop-grid.upgrades { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.shop-panel.upgrades { width: min(640px, 100%); }

.title { position: absolute; left: 0; right: 0; top: 24%; text-align: center; opacity: 0; transition: opacity 0.25s; }
.title.show { opacity: 1; animation: title-pop 0.35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes title-pop { from { transform: scale(0.6); } }
.title-main {
  font-family: 'Lilita One', Rubik, sans-serif; font-size: clamp(42px, 8vw, 80px); line-height: 1.05;
  -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink);
}
.title-sub { font: 400 clamp(18px, 2.6vw, 24px) 'Lilita One', Rubik, sans-serif; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; margin-top: 8px; }

.actionbar {
  position: absolute; left: 50%; bottom: 170px; transform: translateX(-50%);
  font: 400 19px 'Lilita One', Rubik, sans-serif; color: var(--gold); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill;
  opacity: 0; transition: opacity 0.2s; white-space: nowrap;
}
.actionbar.show { opacity: 1; }
.item-name {
  position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%);
  font: 400 17px 'Lilita One', Rubik, sans-serif; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill;
  opacity: 0; transition: opacity 0.3s; white-space: nowrap;
}
.item-name.show { opacity: 1; }
.item-name { text-align: center; bottom: 122px; }
.item-name small { display: block; font: 700 13px Rubik, sans-serif; color: var(--cream); -webkit-text-stroke: 0; text-shadow: 0 1px 0 var(--ink), 0 0 3px var(--ink); margin-top: 2px; }
.debug { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font: 600 12px ui-monospace, monospace; background: rgba(0, 0, 0, 0.55); padding: 5px 8px; border-radius: 6px; }

.hurt-fx { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 0, 0, 0.45)); }
.hurt-fx.on { animation: hurt 0.45s; }
@keyframes hurt { 0% { opacity: 1; } 100% { opacity: 0; } }
.death {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  background: radial-gradient(ellipse at center, rgba(120, 0, 0, 0.25), rgba(90, 0, 0, 0.6));
}
.death-title { font: 400 clamp(54px, 10vw, 96px) 'Lilita One', Rubik, sans-serif; color: var(--red); -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 var(--ink); }
.death-sub { font: 400 24px 'Lilita One', Rubik, sans-serif; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }

.pause { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(20, 10, 0, 0.45); pointer-events: auto; }
.pause-card { display: flex; flex-direction: column; gap: 10px; min-width: 260px; }

/* ------------------------------------------------------------ inventory & shop */

.screen { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20, 10, 0, 0.45); z-index: 20; padding: 12px; }
.inv-panel { display: flex; flex-direction: column; gap: 10px; }
.inv-top { display: flex; gap: 14px; align-items: center; }
.inv-armor { display: flex; gap: 5px; }
.inv-tip { font-size: 12px; font-weight: 800; color: var(--cream); text-shadow: 0 1px 0 var(--ink); max-width: 260px; }
.inv-grid { display: grid; grid-template-columns: repeat(9, 52px); gap: 5px; }
.inv-hot { margin-top: 6px; padding-top: 10px; border-top: 3px dashed rgba(67, 36, 14, 0.5); }
.islot {
  position: relative; width: 52px; height: 52px; border-radius: 8px; background: #d39457; border: 3px solid #5a3214;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18); display: grid; place-items: center; cursor: pointer;
}
.islot:hover { background: #eab778; }
.islot.selected { border-color: var(--gold); }
.islot.armor { background: #b98049; }
.islot img { width: 38px; height: 38px; pointer-events: none; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.3)); }
.islot span, .cursor-stack span, .offer-icon span {
  position: absolute; right: 3px; bottom: 0; font: 400 17px 'Lilita One', Rubik, sans-serif; color: #fff;
  -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; pointer-events: none;
}
.cursor-stack { position: fixed; left: 0; top: 0; width: 48px; height: 48px; pointer-events: none; z-index: 30; display: grid; place-items: center; }
.cursor-stack img { width: 40px; height: 40px; }
.inv-tooltip {
  position: fixed; left: 0; top: 0; z-index: 31; pointer-events: none; padding: 4px 9px; border-radius: 7px;
  background: rgba(20, 10, 30, 0.92); border: 2px solid #5c3fa0; font-weight: 800; font-size: 14px;
}

.shop-panel { width: min(820px, 100%); max-height: 92vh; display: flex; flex-direction: column; gap: 10px; position: relative; }
.close-x {
  position: absolute; right: 10px; top: 8px; width: 38px; height: 38px; border-radius: 10px; cursor: pointer;
  background: linear-gradient(#ff7a6b, var(--red)); border: 3px solid var(--ink); color: #fff; font-weight: 900; font-size: 18px;
  box-shadow: 0 3px 0 var(--ink);
}
.shop-body { display: flex; gap: 10px; min-height: 0; flex: 1; }
.shop-tabs { display: flex; flex-direction: column; gap: 6px; }
.shop-tab {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; text-align: left;
  font: 400 16px 'Lilita One', Rubik, sans-serif; color: var(--ink);
  background: var(--cream); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 3px 0 var(--ink);
}
.shop-tab img { width: 28px; height: 28px; }
.shop-tab.active { background: #ffe680; }
.shop-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; overflow-y: auto; align-content: start; padding: 2px 4px 6px 2px; }
.offer {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 6px; cursor: pointer;
  background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 var(--ink);
  font-family: Rubik, sans-serif; transition: transform 0.06s;
}
.offer:hover { transform: translateY(-2px); background: #fff8e8; }
.offer:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.offer-icon { position: relative; width: 52px; height: 52px; display: grid; place-items: center; background: #d39457; border: 3px solid #5a3214; border-radius: 10px; }
.offer-icon img { width: 38px; height: 38px; }
.offer-name { font: 400 15px 'Lilita One', Rubik, sans-serif; text-align: center; line-height: 1.1; }
.offer-cost { font-size: 12px; font-weight: 800; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.cost { display: inline-flex; align-items: center; gap: 2px; }
.cost img { width: 16px; height: 16px; }
.offer.poor .offer-cost { color: #c0281e; }
.offer.owned, .offer.maxed { opacity: 0.6; }
.offer.owned .offer-cost, .offer.maxed .offer-cost { color: var(--green-dark); }
.offer.flash-ok { animation: ok 0.35s; }
.offer.flash-no { animation: no 0.3s; }
@keyframes ok { 50% { background: #b7f59a; transform: scale(1.05); } }
@keyframes no { 25% { transform: translateX(-4px); background: #ffb4ab; } 75% { transform: translateX(4px); } }
.shop-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.wallet { display: flex; gap: 12px; flex-wrap: wrap; font-weight: 800; text-shadow: 0 2px 0 var(--ink); }
.wallet-item { display: inline-flex; align-items: center; gap: 4px; }
.wallet-item img { width: 22px; height: 22px; }
.shop-note { font: 400 17px 'Lilita One', Rubik, sans-serif; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
.shop-note.ok { color: #9dff7a; }
.shop-note.no { color: #ff8a80; }

@media (max-width: 640px) {
  .slot { width: 36px; height: 36px; }
  .slot-icon { width: 26px; height: 26px; }
  .inv-grid { grid-template-columns: repeat(9, 34px); }
  .islot { width: 34px; height: 34px; }
  .islot img { width: 24px; height: 24px; }
  .keyhints, .board { display: none; }
  .hunger { width: 130px; }
  .heart { width: 18px; height: 18px; }
  .shop-body { flex-direction: column; }
  .shop-tabs { flex-direction: row; overflow-x: auto; }
}

/* ------------------------------------------------------------ chat, lobby, end */

.chat {
  position: absolute; left: 12px; bottom: 170px; width: min(420px, 42vw); max-height: 34vh; overflow: hidden;
  display: flex; flex-direction: column; gap: 2px; pointer-events: none;
}
.chat.open { overflow-y: auto; background: rgba(20, 12, 6, 0.35); border-radius: 10px; padding: 6px; pointer-events: auto; }
.chat-msg {
  font-weight: 700; font-size: 15px; line-height: 1.3; padding: 2px 8px; border-radius: 6px;
  background: rgba(20, 12, 6, 0.55); text-shadow: 0 1px 0 var(--ink); transition: opacity 0.6s; width: fit-content; max-width: 100%;
  overflow-wrap: anywhere;
}
.chat-msg.old { opacity: 0; }
.chat.open .chat-msg.old { opacity: 1; }
.chat-msg b { font-weight: 800; }
.chat-msg.system { color: var(--gold); }
.chat-input {
  position: absolute; left: 12px; bottom: 132px; width: min(420px, 42vw); pointer-events: auto;
  font: 700 16px Rubik, sans-serif; color: #fff; background: rgba(20, 12, 6, 0.8);
  border: 3px solid var(--ink); border-radius: 10px; padding: 8px 10px; outline: none;
}
.blind { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.97) 38%); }

.teams-panel { width: min(560px, 100%); display: flex; flex-direction: column; gap: 10px; }
.teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.team-card {
  display: flex; flex-direction: column; gap: 4px; align-items: stretch; padding: 8px; cursor: pointer; text-align: left;
  background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 var(--ink);
  font-family: Rubik, sans-serif;
}
.team-card.mine { box-shadow: 0 4px 0 var(--ink), inset 0 0 0 3px #fff; background: #ffe680; }
.team-card.full { opacity: 0.55; cursor: not-allowed; }
.team-name { font: 400 18px 'Lilita One', Rubik, sans-serif; display: flex; align-items: center; gap: 6px; }
.team-name i { width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--ink); display: inline-block; }
.team-members { font-size: 12px; font-weight: 700; min-height: 15px; color: #6b4a2c; }
.teams-foot { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.room-code { font: 400 22px 'Lilita One', Rubik, sans-serif; color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; letter-spacing: 2px; }
.lobby-list { font-weight: 800; font-size: 13px; text-shadow: 0 1px 0 var(--ink); }

.end { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(20, 10, 0, 0.5); pointer-events: auto; }
.end-card { min-width: min(460px, 92vw); display: flex; flex-direction: column; gap: 10px; text-align: center; }
.end-title { font: 400 clamp(46px, 9vw, 84px) 'Lilita One', Rubik, sans-serif; -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); }
.end-table { width: 100%; border-collapse: collapse; font-weight: 800; font-size: 14px; text-shadow: 0 1px 0 var(--ink); }
.end-table td, .end-table th { padding: 4px 6px; text-align: left; }
.end-table th { font: 400 14px 'Lilita One', Rubik, sans-serif; color: var(--gold); }
.trap-head { grid-column: 1 / -1; font: 400 17px 'Lilita One', Rubik, sans-serif; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; margin-top: 6px; }
.trap-head b { color: var(--gold); }
.cont { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; border-bottom: 3px dashed rgba(67, 36, 14, 0.5); margin-bottom: 4px; }
.cont-title { font-size: 24px; }
.inv-title { font-size: 24px; }

.tablist {
  position: absolute; left: 50%; top: 70px; transform: translateX(-50%); min-width: min(420px, 92vw); max-height: 70vh; overflow: hidden;
  background: rgba(20, 12, 6, 0.78); border: 3px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 10px 14px;
  font-weight: 700; font-size: 14px; display: flex; flex-direction: column; gap: 3px;
}
.tab-head { font: 400 18px 'Lilita One', Rubik, sans-serif; color: var(--gold); text-align: center; margin-bottom: 4px; }
.tab-team { font: 400 16px 'Lilita One', Rubik, sans-serif; margin-top: 4px; display: flex; justify-content: space-between; }
.tab-row { display: flex; justify-content: space-between; gap: 16px; padding: 1px 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.05); }
.tab-row.out, .tab-row.left { opacity: 0.45; text-decoration: line-through; }
.tab-row.dead { opacity: 0.7; }
.end-why { font-weight: 800; color: var(--cream); text-shadow: 0 1px 0 var(--ink); }
.end-next { font-weight: 800; text-shadow: 0 1px 0 var(--ink); }
.end-next b { color: var(--gold); }

.topbar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 70vw; }
.tb-rank {
  font: 400 26px 'Lilita One', Rubik, sans-serif; color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill;
  background: linear-gradient(#a65cff, #7a2fe0); border: 3px solid var(--ink); border-radius: 10px; padding: 2px 10px; box-shadow: 0 4px 0 var(--ink);
  display: flex; align-items: center; gap: 4px;
}
.tb-rank i { font-style: normal; -webkit-text-stroke: 0; font-size: 22px; }
.tb-team { display: flex; gap: 3px; padding: 3px; border-radius: 8px; background: var(--tc); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
.tb-team.nobed { background: repeating-linear-gradient(45deg, var(--tc) 0 6px, rgba(0, 0, 0, 0.25) 6px 10px); }
.face { position: relative; width: 30px; height: 30px; border-radius: 6px; overflow: hidden; border: 2px solid rgba(0, 0, 0, 0.45); background: #222; }
.face img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.face.dead img { filter: grayscale(1) brightness(0.7); }
.face.out { opacity: 0.45; }
.face.out::after { content: '✕'; position: absolute; inset: 0; display: grid; place-items: center; color: #ff4f45; font: 900 22px Rubik, sans-serif; text-shadow: 0 1px 0 #000; }
@media (max-width: 640px) { .face { width: 20px; height: 20px; } .tb-rank { font-size: 18px; } }
.resume {
  position: absolute; left: 50%; top: 58%; transform: translateX(-50%); pointer-events: none;
  font: 400 22px 'Lilita One', Rubik, sans-serif; color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill;
  background: rgba(20, 12, 6, 0.55); border-radius: 12px; padding: 6px 16px; animation: resume-bob 1.6s ease-in-out infinite;
}
.resume b { color: var(--gold); }
@keyframes resume-bob { 50% { transform: translateX(-50%) translateY(-4px); } }

.howto { display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
.howto-icons { display: flex; gap: 10px; justify-content: center; }
.howto-icons img { width: 52px; height: 52px; padding: 6px; background: #d39457; border: 3px solid #5a3214; border-radius: 12px; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.3)); }
.howto-title { font: 400 26px 'Lilita One', Rubik, sans-serif; color: var(--gold); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }
.howto-text { font-weight: 700; font-size: 15px; line-height: 1.45; text-shadow: 0 1px 0 var(--ink); max-width: 380px; }
.howto-text b { color: #fff6c0; }
.howto-nav { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 8px; }
.howto-nav .btn[disabled] { opacity: 0.4; pointer-events: none; }
.howto-dots { display: flex; gap: 5px; }
.howto-dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(0, 0, 0, 0.35); border: 2px solid var(--ink); }
.howto-dots i.on { background: var(--gold); }
